<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloop Renderer</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
    }
    #app {
      width: 100%;
      height: 100%;
      position: relative;
      background: transparent;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    #status-badge {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      padding: 3px 10px;
      border-radius: 999px;
      font: 600 11px/1.3 'Segoe UI', system-ui, sans-serif;
      color: #e0f2fe;
      background: rgba(12, 24, 48, 0.72);
      border: 1px solid rgba(56, 189, 248, 0.35);
      backdrop-filter: blur(6px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      white-space: nowrap;
    }
    #status-badge.visible {
      opacity: 1;
    }
    .edge-glow {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
    }
    .edge-glow.active {
      opacity: 1;
    }
    #glow-left {
      top: 12%;
      bottom: 12%;
      left: 0;
      width: 5px;
      border-radius: 0 6px 6px 0;
      background: linear-gradient(180deg, transparent, #38bdf8, transparent);
      box-shadow: 0 0 12px #38bdf8;
    }
    #glow-right {
      top: 12%;
      bottom: 12%;
      right: 0;
      width: 5px;
      border-radius: 6px 0 0 6px;
      background: linear-gradient(180deg, transparent, #38bdf8, transparent);
      box-shadow: 0 0 12px #38bdf8;
    }
    #glow-top {
      left: 12%;
      right: 12%;
      top: 0;
      height: 5px;
      border-radius: 0 0 6px 6px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
      box-shadow: 0 0 12px #38bdf8;
    }
    #glow-bottom {
      left: 12%;
      right: 12%;
      bottom: 0;
      height: 5px;
      border-radius: 6px 6px 0 0;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
      box-shadow: 0 0 12px #38bdf8;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-CzsCitjj.js"></script>
</head>
<body>
  <div id="app">
    <div id="glow-left" class="edge-glow"></div>
    <div id="glow-right" class="edge-glow"></div>
    <div id="glow-top" class="edge-glow"></div>
    <div id="glow-bottom" class="edge-glow"></div>
    <div id="status-badge">Idle</div>
  </div>
</body>
</html>
